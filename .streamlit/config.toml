[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#10B981"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#111827"
textColor = "#F8FAFC"
font = "sans serif"
